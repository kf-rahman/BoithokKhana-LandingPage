# Postgres + API for local dev / a simple deploy.
# Local dev WITHOUT Docker also works: the API defaults to SQLite, so you
# can just run `uvicorn app.main:app --reload` in backend/ (see README-APP.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: catering
      POSTGRES_PASSWORD: catering
      POSTGRES_DB: catering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://catering:catering@db:5432/catering
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: claude-opus-4-8
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
