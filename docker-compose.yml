# Local production-like stack: Postgres + FastAPI backend + Next.js frontend.
# `docker compose up --build` brings up all three: db, API on :8000, web on
# :3000. In production the frontend can instead deploy to Vercel — just point
# its NEXT_PUBLIC_API_URL at the backend. See DEPLOY.md.
#
# Secrets come from a root .env file (gitignored) that Compose reads for
# ${VAR} substitution — set ADMIN_PIN, ANTHROPIC_API_KEY, SMTP_* there.
# See env.example for the full list.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boithok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boithok}
      POSTGRES_DB: boithok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boithok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://boithok:${POSTGRES_PASSWORD:-boithok}@db:5432/boithok
      ADMIN_PIN: ${ADMIN_PIN:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-orders@boithokkhana.ca}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      # Root context: the build needs index.html (the marketing site served at
      # "/"), which lives outside frontend/. See frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time; the browser (on the host)
        # reaches the API via the published port, hence localhost:8000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
