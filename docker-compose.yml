# Local production-like stack: Postgres + the FastAPI backend.
# The Next.js frontend deploys separately (e.g. Vercel) — point its
# NEXT_PUBLIC_API_URL at this backend.
#
# Secrets come from a root .env file (gitignored) that Compose reads for
# ${VAR} substitution — set ADMIN_PIN, ANTHROPIC_API_KEY, SMTP_* there.
# See backend/.env.example for the full list.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boithok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boithok}
      POSTGRES_DB: boithok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boithok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://boithok:${POSTGRES_PASSWORD:-boithok}@db:5432/boithok
      ADMIN_PIN: ${ADMIN_PIN:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-orders@boithokkhana.ca}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
