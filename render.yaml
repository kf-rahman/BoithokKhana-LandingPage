# Render blueprint — one static web service, nothing else.
#
# To deploy: Render Dashboard -> New -> Blueprint -> pick this repo. The
# service keeps its original name (boithok-web) so the www.boithokkhana.ca /
# boithokkhana.ca domains stay attached to it across this change.
#
# WHAT USED TO BE HERE: a FastAPI service (boithok-api) and a free Postgres
# (boithok-db) backing an online order form with LLM order parsing. Both were
# removed — orders come in on WhatsApp/Messenger instead. If you ever revive
# the order app, the full blueprint is in this repo's git history and on the
# workflow-1 / workflow3 branches.
#
# NOTE: removing services from a blueprint does not delete them on Render.
# Delete boithok-api and boithok-db by hand in the dashboard, or they keep
# sitting there (and boithok-db's free 30-day clock keeps running).

services:
  - type: web
    name: boithok-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free instances sleep after 15 minutes idle and take ~1 minute to wake,
    # which is why .github/workflows/keep-warm.yml pings the site during
    # opening hours. Upgrading to `starter` would remove the need for it.
    plan: free
    healthCheckPath: /health
    domains:
      - www.boithokkhana.ca
      - boithokkhana.ca
